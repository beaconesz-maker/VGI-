html{scroll-behavior:smooth}
body{font-family:-apple-system,"Segoe UI",system-ui,sans-serif;background:#f0ecf5;color:var(--ink);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
.hdr{background:linear-gradient(135deg,var(--mv),var(--mvd));color:#fff;padding:calc(.6rem + env(safe-area-inset-top)) 1.1rem .6rem;display:flex;align-items:center;gap:.8rem;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.18)}

input[type=text],input[type=number],textarea,select{border:1.5px solid var(--bd);border-radius:8px;padding:.5rem .65rem;font-size:.9rem;font-family:inherit;background:#fff;color:var(--ink);width:100%}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.6rem}

.seg{display:inline-flex;border:1.5px solid var(--bd);border-radius:8px;overflow:hidden}

.dom{margin:1.1rem 0 .5rem;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mv);border-bottom:2px solid var(--mvl);padding-bottom:.3rem}
.esc{border:1px solid var(--bd);border-radius:11px;margin-bottom:.55rem;overflow:hidden;background:#fff}
.esc-h{display:flex;align-items:center;gap:.6rem;padding:.65rem .85rem;cursor:pointer;user-select:none;background:#fbfafd}
.esc-h:hover{background:#f5f0fa}
.esc-h .nm{font-weight:650;font-size:.9rem;flex:1}
.esc-h .nm small{font-weight:400;color:var(--grey);font-size:.74rem}
.chev{color:var(--grey);transition:transform .15s;font-size:.7rem}
.esc.open .chev{transform:rotate(90deg)}
.bdg{font-size:.76rem;font-weight:750;padding:.13rem .6rem;border-radius:20px;white-space:nowrap}
.bdg.na{background:var(--greyl);color:var(--grey)}
.b-ok{background:var(--okb);color:var(--ok)}.b-warn{background:var(--wnb);color:var(--wn)}
.b-alert{background:var(--alb);color:var(--al)}.b-neutro{background:var(--greyl);color:var(--grey)}
.esc-b{display:none;padding:.3rem .85rem .8rem;border-top:1px solid var(--bd)}
.esc.open .esc-b{display:block}
.na-row{display:flex;align-items:center;gap:.4rem;font-size:.78rem;color:var(--grey);margin:.5rem 0 .2rem}
.itm{padding:.5rem 0;border-bottom:1px dashed #ececf2}
.itm:last-child{border-bottom:none}
.itm-q{font-size:.84rem;font-weight:600;margin-bottom:.35rem}
.itm-q small{font-weight:400;color:var(--grey)}
.opts{display:flex;flex-wrap:wrap;gap:.3rem}
.opt{font-size:.79rem;border:1.5px solid var(--bd);border-radius:7px;padding:.32rem .6rem;cursor:pointer;background:#fff}

.num{width:90px}
.step{display:inline-flex;align-items:center;gap:.5rem}
.step button{width:30px;height:30px;border:1.5px solid var(--bd);background:#fff;border-radius:7px;font-size:1.05rem;cursor:pointer;color:var(--mv)}

.res{margin-top:.55rem;padding:.5rem .7rem;border-radius:8px;font-size:.82rem}

.gg{font-size:.74rem;font-weight:700;color:var(--mv);margin:.55rem 0 .2rem}
.chk{display:flex;align-items:flex-start;gap:.5rem;padding:.3rem 0;font-size:.82rem;cursor:pointer}

.note{background:var(--bluel);border:1px solid #bcd6f3;border-radius:8px;padding:.5rem .7rem;font-size:.76rem;color:#234e7d;margin-top:.5rem;line-height:1.5}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1.1rem;border-radius:9px;border:none;font-size:.86rem;font-weight:650;cursor:pointer;font-family:inherit;transition:filter .15s}
.btn:active{filter:brightness(.94)}
.btn-p{background:var(--mv);color:#fff}.btn-g{background:#fff;color:var(--mv);border:1.5px solid var(--mv)}
.btn-d{background:#fff;color:#888;border:1.5px solid #ccc;font-size:.8rem}
.btn-big{padding:.8rem 1.6rem;font-size:.95rem}
.btn-row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.7rem;align-items:center}
.status{padding:.5rem .8rem;border-radius:8px;font-size:.82rem;margin-top:.6rem;display:none;line-height:1.5}
.status.ok{background:var(--okb);color:var(--ok);display:block}
.status.err{background:var(--alb);color:var(--al);display:block}

.psec{background:var(--greyl);border:1px solid var(--bd);border-radius:10px;padding:.8rem .9rem;margin-bottom:.6rem}

.psec li{font-size:.79rem;margin-bottom:.3rem;line-height:1.5}
.pitem{font-size:.79rem;line-height:1.5;margin-bottom:.25rem}
.tag{display:inline-block;font-size:.66rem;font-weight:700;padding:.1rem .4rem;border-radius:5px;margin-right:.3rem}

.empty{text-align:center;color:#aab;padding:2rem 1rem;font-size:.85rem}
.pat-list{display:flex;flex-direction:column;gap:.4rem}
.pat-row{display:flex;align-items:center;gap:.6rem;padding:.55rem .7rem;border:1.5px solid var(--bd);border-radius:9px;cursor:pointer;background:#fff}

.pat-row.on{border-color:var(--mv);background:var(--mvl)}

.chart-wrap{border:1px solid var(--bd);border-radius:10px;padding:.6rem;background:#fff;overflow-x:auto}
table.snap{width:100%;border-collapse:collapse;font-size:.75rem}
table.snap th,table.snap td{border:1px solid var(--bd);padding:.35rem .5rem;text-align:center}
table.snap th{background:var(--mvl);color:var(--mvd)}

.priv{background:var(--wnb);border:1px solid #f0d98a;border-radius:9px;padding:.55rem .85rem;font-size:.75rem;color:#6b5320;margin-top:.7rem;line-height:1.5}
.help{font-size:.75rem;color:#8a93a3;margin-top:.3rem;line-height:1.45}

.hdr .lockbtn:hover{background:#ffffff33}

.fg.lab-warn input{border-color:#e0a800;background:#fffdf3}
.fg.lab-block input{border-color:var(--al);background:#fdeeeb}
.lab-msg{font-size:.7rem;line-height:1.35;margin-top:.25rem;padding:.3rem .5rem;border-radius:6px}
.lab-msg.warn{background:var(--wnb);border:1px solid #f0d98a;color:#6b5320}

.valbox{background:var(--mvl);border:1px solid #d9c6e8;border-radius:10px;padding:.75rem .9rem;margin:.6rem 0}

.gate-field{margin-bottom:.7rem}

.gate-btn{width:100%;background:var(--mv);color:#fff;border:none;border-radius:10px;padding:.8rem;font-size:.92rem;font-weight:750;cursor:pointer}

.manual h3{color:var(--mvd);font-size:.95rem;margin:1.1rem 0 .4rem;padding-bottom:.25rem;border-bottom:1px solid #e6dcf0}

.manual ul{margin:.3rem 0 .7rem 1.2rem}
.manual li{font-size:.85rem;margin-bottom:.3rem;line-height:1.5}
.manual .step{font-weight:700;color:var(--mv)}
</style>
</head>

  }else if(esc.tipo==='tug'){
    if(st.num==null)return;const t=st.num;label=t<10?'normal':t<13.5?'movilidad reducida':t<=20?'riesgo aumentado':'alto riesgo caídas';cls=t<10?'b-ok':t<13.5?'b-warn':'b-alert';raw=t;bT=`${t} s`;sT=`${t} s — ${label}`;

    if(st.num==null)return;const n=st.num;label=n>=4?'normal':n===3?'alteración leve':n===2?'alteración moderada':n===1?'alteración grave':'irreconocible';cls=n>=4?'b-ok':n>=3?'b-warn':'b-alert';raw=n;bT=`${n}/5`;sT=`Test del Reloj ${n}/5 — ${label}`;
  }else if(esc.tipo==='frailvig'){
    if(st.idx==null)return;const x=st.idx;label=x<0.2?'sin fragilidad':x<=0.35?'fragilidad leve':x<=0.5?'fragilidad moderada':'fragilidad avanzada';cls=x<0.2?'b-ok':x<=0.5?'b-warn':'b-alert';raw=x;bT=x.toFixed(2);sT=`IF-VIG ${x.toFixed(2)} — ${label}`;
  }else if(esc.tipo==='cfs'){
    if(st.cfs==null)return;const n=st.cfs;label=n<=3?'robusto':n===4?'vulnerable':n<=6?'fragilidad leve-moderada':'fragilidad grave';cls=n<=3?'b-ok':n===4?'b-warn':n<=6?'b-warn':'b-alert';raw=n;bT=`CFS ${n}`;sT=`CFS ${n} — ${label}`;
  }else if(esc.tipo==='charlson'){
    let s=0;CHARL.forEach(([k,,w])=>{if(st.charl[k])s+=w;});const edad=pacEdad();let ap=0;if(edad!=null&&edad>=50)ap=Math.min(5,Math.floor((edad-40)/10));const tot=s+ap;label=tot<=1?'bajo riesgo':tot<=3?'moderado':tot<=5?'alto':'muy alto';cls=tot<=1?'b-ok':tot<=3?'b-warn':'b-alert';raw=tot;bT=`${tot} ptos`;sT=`Charlson ${tot} ptos (comorbilidad ${s} + edad ${ap}) — riesgo ${label}`;
  }else if(esc.tipo==='cirsg'){
    const v=Object.values(st.cirs);const tot=v.reduce((a,b)=>a+b,0);const endo=v.filter(x=>x>0).length;const is=endo?(tot/endo).toFixed(2):0;const n3=v.filter(x=>x>=3).length,n4=v.filter(x=>x===4).length;raw=tot;label=`total ${tot} · ${endo} categorías · IS ${is} · grado≥3: ${n3}`;cls=n4>0||n3>=2?'b-alert':n3===1?'b-warn':'b-ok';bT=`${tot}`;sT=label;

/* ── VALIDACIÓN DE VALORES ANALÍTICOS ──
   Dos niveles POR ANALITO. Edita libremente los números aquí:
     block[min,max] = ROJO, BLOQUEA. Valores fisiológicamente imposibles
                      (casi siempre un error de tecleo). Obligan a confirmar.
     warn [min,max] = AMARILLO, no bloquea. Valores clínicamente inusuales
                      pero posibles; solo piden una segunda mirada.
   Para convertir un aviso en bloqueo, mueve el número del array 'warn' al 'block'. */
const LABLIM={
 'cl-hb':   {label:'Hb (g/dL)',        block:[2,20],     warn:[8,18]},
 'cl-vcm':  {label:'VCM (fL)',         block:[20,200],   warn:[70,110]},
 'cl-fer':  {label:'Ferritina (ng/mL)',block:[0,40000],  warn:[5,1000]},
 'cl-ist':  {label:'IST/TSAT (%)',     block:[0,100],    warn:[5,90]},
 'cl-b12':  {label:'Vit. B12 (pg/mL)', block:[0,20000],  warn:[50,1500]},
 'cl-fol':  {label:'Ác. fólico (ng/mL)',block:[0,100],   warn:[1,22]},
 'cl-egfr': {label:'eGFR',             block:[0,200],    warn:[8,100]},
 'cl-vitd': {label:'25-OH-D (ng/mL)',  block:[0,200],    warn:[10,60]},
 'cl-hba1c':{label:'HbA1c (%)',        block:[2,20],     warn:[4,15]}
};
function validateLab(id){
  const lim=LABLIM[id],inp=$(id);if(!lim||!inp)return;
  const fg=inp.closest('.fg');if(!fg)return;
  const v=inp.value===''?null:parseFloat(inp.value);
  let msg=fg.querySelector('.lab-msg');
  fg.classList.remove('lab-warn','lab-block');
  if(v==null||isNaN(v)){APP._labState[id]='ok';if(msg)msg.remove();buildPlanPreview&&APP._planLive&&buildPlanPreview();return;}
  let state='ok';
  if(v<lim.block[0]||v>lim.block[1])state='block';
  else if(v<lim.warn[0]||v>lim.warn[1])state='warn';
  APP._labState[id]=state;
  if(state==='ok'){if(msg)msg.remove();}
  else{
    if(!msg){msg=document.createElement('div');fg.appendChild(msg);}
    if(state==='warn'){
      fg.classList.add('lab-warn');
      msg.className='lab-msg warn';
      msg.innerHTML=`⚠️ Valor clínicamente inusual para ${lim.label}. Verifique que es correcto.`;
    }else{
      fg.classList.add('lab-block');
      const confirmed=(APP._labConfirmVal[id]===v);
      msg.className='lab-msg block';
      msg.innerHTML=`⛔ Valor fuera del rango fisiológicamente posible para ${lim.label}. Revise la cifra: casi siempre es un error de tecleo.`+
        `<label class="cfm"><input type="checkbox" ${confirmed?'checked':''}> Confirmo que este valor es correcto</label>`;
      const cb=msg.querySelector('input');
      cb.addEventListener('change',e=>{
        if(e.target.checked){APP._labConfirmVal[id]=v;APP._labConfirmAt[id]=new Date();}
        else{APP._labConfirmVal[id]=null;APP._labConfirmAt[id]=null;}
        buildPlanPreview();
      });
    }
  }
  APP._planLive&&buildPlanPreview();
}
/* ¿Hay algún valor imposible sin confirmar? Bloquea la generación de documentos. */
function labGateOK(){
  return !Object.keys(LABLIM).some(id=>{
    const inp=$(id);if(!inp||inp.value==='')return false;
    const v=parseFloat(inp.value);const lim=LABLIM[id];
    const blocked=(v<lim.block[0]||v>lim.block[1]);
    return blocked&&APP._labConfirmVal[id]!==v;
  });
}
function labBlockedList(){
  return Object.keys(LABLIM).filter(id=>{
    const inp=$(id);if(!inp||inp.value==='')return false;
    const v=parseFloat(inp.value);const lim=LABLIM[id];
    const blocked=(v<lim.block[0]||v>lim.block[1]);
    return blocked&&APP._labConfirmVal[id]!==v;
  }).map(id=>LABLIM[id].label);
}

function adaCat(){
  if(APP.clin.cat)return APP.clin.cat;
  const b=RAW('barthel'),mm=RAW('mmse'),pf=RAW('pfeiffer'),cfs=RAW('cfs'),vig=RAW('frailvig'),katz=RAW('katz');
  const poor=(mm!=null&&mm<=12)||(pf!=null&&pf>=8)||(b!=null&&b<=35)||(cfs!=null&&cfs>=7)||(vig!=null&&vig>0.5)||(katz!=null&&katz>=5);
  if(poor)return'poor';
  const complex=(mm!=null&&mm<=24)||(pf!=null&&pf>=3)||(b!=null&&b<=90)||(katz!=null&&katz>=2)||(cfs!=null&&cfs>=5)||(vig!=null&&vig>0.2)||(RAW('frail')!=null&&RAW('frail')>=3);
  return complex?'complex':'healthy';
}

    cl[dom].push({nom:s.nom,val:APP.scores[s.id].txt});}});

  /* EJE 1 — VIVIFRAIL */
  if(RAW('sppb')!=null){const v=RAW('sppb');let P,E;if(v<=3){P='A';E='discapacidad';}else if(v<=6){P='B';E='fragilidad';}else if(v<=9){P='C';E='prefragilidad';}else{P='D';E='robusto';}
    let plus=false,pr=[];if(P!=='A'&&P!=='D'){if(RAW('tug')!=null&&RAW('tug')>=13.5){plus=true;pr.push('TUG ≥13,5 s');}if(RAW('sarcf')!=null&&RAW('sarcf')>=4){plus=true;pr.push('SARC-F ≥4');}if(RAW('gait')!=null&&RAW('gait')<=0.8){plus=true;pr.push('marcha ≤0,8 m/s');}}
    const PL=P+(plus?'+':'');
    rec.ejercicio={t:'Ejercicio físico multicomponente (VIVIFRAIL)',l:[
      `SPPB ${v}/12 → Pasaporte VIVIFRAIL ${PL} (${E}).`+(plus?` Variante "+" por: ${pr.join(', ')}.`:''),
      'Componentes: fuerza y potencia de MMII, equilibrio y coordinación, reentrenamiento de la marcha, flexibilidad y resistencia aeróbica.',
      'Dosis: 30-45 min, 3 días/semana, intensidad baja-moderada progresiva, mínimo 8 semanas.',
      `Consultar rueda de ejercicios VIVIFRAIL ${PL} en vivifrail.com. Reevaluar SPPB al finalizar para reasignar pasaporte.`],
      f:'Ministerio de Sanidad 2022 (consenso VIVIFRAIL); vivifrail.com'};}

  /* EJE 2 — NUTRICIÓN */
  const glimSi=RAW('glim')===1;const mnaRiesgo=APP.scores.mna&&APP.scores.mna.present&&APP.scores.mna.label&&APP.scores.mna.label!=='normal';
  if(APP.scores.mna&&APP.scores.mna.present||APP.scores.glim&&APP.scores.glim.present){
    let l;if(glimSi||mnaRiesgo){
      l=['Desnutrición / riesgo nutricional confirmado: plan nutricional intensificado.',
       'Aporte proteico 1,2-1,5 g/kg/día (ajustar en ERC grave sin diálisis).',
       'Suplementos nutricionales orales si la dieta no cubre requerimientos: ≥400 kcal/día y ≥30 g proteína/día durante ≥1 mes con revisión mensual.',
       'Energía ≈30 kcal/kg/día. Intervención multimodal: apoyo en comidas, enriquecimiento de texturas, consejo dietético individualizado. Priorizar siempre la vía oral.',
       'Tratar causas reversibles de baja ingesta: dolor, polifarmacia, salud bucodental, estreñimiento, depresión.',
       'Combinar con ejercicio multicomponente para preservar masa y función muscular.',
       'Hidratación adecuada: ≈1,6 L/día (mujeres) / ≈2,0 L/día (hombres).'];
    }else{l=['Estado nutricional adecuado. Mantener ≈30 kcal/kg/día y ≥1,0-1,2 g/kg/día de proteína. Evitar dietas restrictivas no justificadas. Mantener cribado nutricional periódico.'];}
    rec.nutricion={t:'Nutrición (ESPEN)',l,f:'Volkert D et al. ESPEN 2019 (PMID 30005900); ESPEN 2022 (PMID 35306388); PROT-AGE 2013 (PMID 23867520)'};}

  /* EJE 3 — CAÍDAS */
  const cN=APP.pac.caidas;const rCaidas=(RAW('sppb')!=null&&RAW('sppb')<=8)||(RAW('frail')!=null&&RAW('frail')>=3)||(RAW('sarcf')!=null&&RAW('sarcf')>=4)||(RAW('tug')!=null&&RAW('tug')>=13.5)||(RAW('gait')!=null&&RAW('gait')<=0.8)||(cN!=null&&cN>=1)||(RAW('cfs')!=null&&RAW('cfs')>=5);
  if(rCaidas){const fc=[];if(cN!=null&&cN>0)fc.push(`${cN} caída(s) en el último año`);if(RAW('frail')!=null&&RAW('frail')>=3)fc.push('fragilidad (FRAIL)');if(RAW('sppb')!=null&&RAW('sppb')<=8)fc.push(`SPPB ${RAW('sppb')}/12`);if(RAW('tug')!=null&&RAW('tug')>=13.5)fc.push(`TUG ${RAW('tug')} s`);if(RAW('gait')!=null&&RAW('gait')<=0.8)fc.push(`marcha ${RAW('gait')} m/s`);
    rec.caidas={t:'Prevención de caídas (NICE NG249)',l:[
      `Riesgo elevado de caídas${fc.length?' por: '+fc.join(', '):''}. Ofrecer valoración multifactorial si ha caído en el último año con ≥1 criterio (fragilidad, ≥2 caídas, lesión que precisó atención, pérdida de conciencia o incapacidad para levantarse).`,
      'Valoración multifactorial: TA en decúbito y bipedestación (hipotensión ortostática), cognición y ánimo, calzado y pie, marcha-equilibrio-fuerza, visión, audición, continencia, mareo/vértigo, riesgo de osteoporosis y enfermedades crónicas.',
      'Revisión estructurada de la medicación: retirar o ajustar psicofármacos y otros fármacos de riesgo (ver módulo STOPP/START).',
      'Programa de ejercicio progresivo centrado en equilibrio, coordinación, fuerza y potencia, alineado con el Pasaporte VIVIFRAIL asignado.',
      'Evaluación de riesgos del entorno domiciliario o residencial con herramienta validada; preferiblemente por terapeuta ocupacional.',
      'Vitamina D para salud ósea y muscular según niveles (ver módulo). Valorar TCC del miedo a caer si persiste tras el programa de ejercicio.'],
      f:'NICE NG249, 2025; Neilson J et al. BMJ 2026;392:s223. doi:10.1136/bmj.s223'};}

  /* EJE 4 — DETERIORO COGNITIVO */
  const cogPos=(RAW('pfeiffer')!=null&&RAW('pfeiffer')>=3)||(RAW('mmse')!=null&&RAW('mmse')<=24)||(RAW('reloj')!=null&&RAW('reloj')<=3);
  if(cogPos){const gr=RAW('mmse')!=null?(RAW('mmse')>=21?'leve':RAW('mmse')>=10?'moderado':'grave'):null;
    rec.demencia={t:'Estudio del deterioro cognitivo (NICE NG97)',l:[
      `Cribado cognitivo positivo`+(RAW('mmse')!=null?` (MMSE ${RAW('mmse')}/30)`:'')+( RAW('pfeiffer')!=null?` · Pfeiffer ${RAW('pfeiffer')} errores`:'')+( RAW('reloj')!=null&&RAW('reloj')<=3?` · Test del Reloj ${RAW('reloj')}/5`:'')+`. Indicado estudio diagnóstico completo.`,
      'Anamnesis estructurada con informante fiable: cronología, repercusión funcional en ABVD y AIVD, síntomas conductuales y psicológicos (SCPD).',
      'Neuroimagen estructural (TC o RM preferible) para apoyar diagnóstico y excluir causas estructurales.',
      'Analítica de causas reversibles: hemograma, VSG/PCR, glucosa/HbA1c, función renal y hepática, iones (calcio), TSH, vitamina B12 y ácido fólico.',
      `Filiar subtipo de demencia. Derivar a unidad de memoria / geriatría / neurología. Si demencia establecida: valorar IACE${gr?` (estadio ${gr})`:''} y memantina en fases moderada-grave, junto a medidas no farmacológicas y apoyo al cuidador.`],
      f:'NICE NG97, 2018; Shulman KI et al. Int Psychogeriatr 2006;18:281-294'};}

  /* EJE 5 — ANEMIA */
  const hb=APP.clin.hb;
  if(hb!=null){const sx=APP.pac.sexo,lim=sx==='M'?12:13,anem=hb<lim,sev=hb<8?'grave':hb<11?'moderada':'leve';
    const fer=APP.clin.fer,ist=APP.clin.ist,inflam=APP.clin.inflam,egfr=APP.clin.egfr,preop=APP.clin.preop;
    const ferrop=(fer!=null&&(fer<30||(inflam&&fer<100)))||(ist!=null&&ist<20);
    const l=[];
    if(preop){
      l.push(`OPTIMIZACIÓN PREOPERATORIA (Vía RICA / PBM): objetivo Hb >13 g/dL en ambos sexos antes de cirugía electiva con riesgo de sangrado. Hb actual ${hb} g/dL.`);
      if(anem||ferrop){
        if(ferrop)l.push('Ferropenia presente: hierro oral de 1.ª línea si hay ≥6 semanas hasta la cirugía. Hierro IV si tiempo insuficiente, intolerancia oral, malabsorción o necesidad de corrección rápida. Reevaluar Hb a las 4 semanas.');
        else l.push('Anemia no ferropénica (Hb 10-13 g/dL): considerar agentes estimulantes de eritropoyesis (rHuEPO) en cirugía con riesgo de sangrado moderado-alto.');
        l.push('No programar cirugía electiva con riesgo de sangrado hasta completar diagnóstico y tratamiento de la anemia.');
      }else{l.push('Hb dentro del objetivo preoperatorio (>13 g/dL). Continuar con protocolo PBM/ERAS institucional.');}
      l.push('Descartar y corregir déficits de B12 y folato. Criterios transfusionales restrictivos intra/postoperatorios: Hb <7-8 g/dL (AABB 2023).');
      l.push('Ácido tranexámico en cirugía mayor con sangrado esperado (nivel de evidencia 1A, Moral V 2024).');
    }else if(anem){
      l.push(`Anemia ${sev} (Hb ${hb} g/dL; umbral OMS ${lim} g/dL).`+(APP.clin.vcm?` VCM ${APP.clin.vcm} fL.`:''));
      if(ferrop)l.push('Patrón ferropénico: hierro oral ~100 mg Fe elemento preferiblemente en días alternos. Hierro IV si intolerancia oral, malabsorción, EII, ERC o corrección urgente. Reevaluar Hb a las 4 semanas.');
      if(APP.clin.b12!=null&&APP.clin.b12<200)l.push('Déficit de vitamina B12: reponer cianocobalamina y estudiar causa.');
      if(APP.clin.fol!=null&&APP.clin.fol<3)l.push('Déficit de folato: reponer ácido fólico.');
      if(egfr!=null&&egfr<60)l.push('Anemia en ERC: corregir primero la ferropenia. Valorar AEE (eritropoyetina) si Hb <10 g/dL persistente; objetivo Hb 10-12 g/dL (no superar 12 g/dL).');
      l.push(`Transfusión restrictiva: umbral Hb <7 g/dL (o <8 g/dL si enfermedad cardiovascular o cirugía ortopédica). Decisión individualizada según síntomas (AABB 2023).`);
    }else{l.push(`Sin anemia (Hb ${hb} g/dL ≥ umbral ${lim} g/dL).`);}
    rec.anemia={t:'Anemia'+(preop?' — optimización preoperatoria (RICA/PBM)':''),l,f:'OMS; Camaschella C. NEJM 2015 (PMID 25946282); Carson JL et al. AABB 2023 (PMID 37824153); Moral V et al. Rev Esp Anestesiol 2024 (PMID 38670490); Muñoz M et al. Rev Clin Esp 2024 (PMID 38423382)'};}

  /* EJE 6 — VITAMINA D */
  if(APP.clin.vitd!=null){const vd=APP.clin.vitd;let cat,l;
    if(vd<20){cat='deficiencia';l=['Deficiencia (<20 ng/mL): colecalciferol en carga (p. ej. 50.000 UI/semana 6-8 semanas o equivalente diario) y mantenimiento posterior 1.500-2.000 UI/día.'];}
    else if(vd<30){cat='insuficiencia';l=['Insuficiencia (20-29 ng/mL): suplementar 1.000-2.000 UI/día y recontrolar a los 3-4 meses.'];}
    else{cat='suficiencia';l=['Niveles suficientes (≥30 ng/mL): mantenimiento según riesgo. En ≥75 años o institucionalizados: ≈800-1.000 UI/día para salud ósea y muscular.'];}
    l.push('Asegurar aporte adecuado de calcio. Recontrolar 25-OH-D a los 3-4 meses. En mayores de 75 años se sugiere suplementación empírica de mantenimiento (Endocrine Society 2024).');
    rec.vitd={t:`Vitamina D — ${cat} (25-OH-D ${vd} ng/mL)`,l,f:'Holick MF et al. Endocrine Society 2011 (PMID 21646368); Demay MB et al. 2024 (PMID 38828931)'};}

  /* EJE 7 — GLUCEMIA */
  if(APP.clin.dm||APP.clin.hba1c!=null){const cat=adaCat();const a1c=APP.clin.hba1c;
    const obj={healthy:'<7,0-7,5 %',complex:'<8,0 %',poor:'evitar hipoglucemia e hiperglucemia sintomática (no depender de HbA1c)'}[cat];
    const catT={healthy:'sano / buena función cognitiva y funcional',complex:'complejo / intermedio',poor:'muy complejo / mala salud'}[cat];
    const l=[`Categoría funcional ADA 2026: ${catT}. Objetivo HbA1c: ${obj}.`+(a1c!=null?` HbA1c actual: ${a1c} %.`:'')];
    if(cat==='poor')l.push('Priorizar evitar hipoglucemia y simplificar/desintensificar el plan terapéutico. Glucemia en ayunas aceptable: 100-180 mg/dL.');
    if(APP.clin.sulin)l.push('Insulina/sulfonilureas: alto riesgo de hipoglucemia. Preferir fármacos de bajo riesgo (metformina si eGFR≥30, iDPP4, iSGLT2, arGLP1 según indicación) y simplificar pautas complejas.');
    l.push('Priorizar fármacos con beneficio CV/renal demostrado cuando esté indicado. Revisar eGFR para dosificación correcta.');
    rec.glucemia={t:'Control glucémico individualizado (ADA 2026)',l,f:'ADA. Diabetes Care 2026;49(Suppl.1):S277-S296. doi:10.2337/dc26-S013'};}

  /* EJE 8 — STOPP/START */
  const ssOn=SS.filter(s=>APP.ss[s[0]]);
  if(ssOn.length){rec.stopstart={t:'Optimización de la medicación (STOPP/START v3)',l:ssOn.map(([,lab])=>lab),f:"O'Mahony D et al. Eur Geriatr Med 2023;14:625-632. doi:10.1007/s41999-023-00777-y"};}

  return{cl,rec};
}

const LSKEY='vgiplus_v1';
const TRACK=[['barthel','Barthel'],['lawton','Lawton'],['katz','Katz dep'],['charlson','Charlson'],['cirsg','CIRS-G'],['frail','FRAIL'],['fried','Fried'],['cfs','CFS'],['frailvig','IF-VIG'],['reloj','T.Reloj'],['gait','Marcha m/s'],['grip','Grip kg'],['tug','TUG s'],['sppb','SPPB'],['sarcf','SARC-F'],['mna','MNA'],['mmse','MMSE'],['pfeiffer','Pfeiffer'],['hb','Hb'],['vitd','25-OH-D'],['hba1c','HbA1c'],['peso','Peso']];
/* La BD vive descifrada en memoria (DBCACHE) tras el desbloqueo.
   loadDB/saveDB siguen siendo síncronas; la escritura cifrada a
   localStorage se hace en segundo plano (persistDB, más abajo). */
function loadDB(){return DBCACHE;}
function saveDB(db){DBCACHE=db;persistDB();}
function snapshot(){const s={fecha:APP.pac.fecha||new Date().toLocaleDateString('es-ES'),vals:{}};
  TRACK.forEach(([k])=>{if(['hb','vitd','hba1c'].includes(k))s.vals[k]=APP.clin[k]??null;else if(k==='peso')s.vals[k]=APP.pac.peso??null;else s.vals[k]=RAW(k);});return s;}
function patKey(){return(APP.pac.nhc||APP.pac.nombre||'sin-id').trim().replace(/\s+/g,'_');}
function saveSnap(){const db=loadDB();const k=patKey();if(!db[k])db[k]={nombre:APP.pac.nombre||k,nhc:APP.pac.nhc||'',snaps:[]};db[k].snaps.push(snapshot());saveDB(db);buildSeguimientoPage();showStatus('seg-status',`✅ Evaluación guardada (${db[k].snaps.length} en total).`,'ok');}
let SEG_PAT=null,SEG_VAR='barthel';
function buildSeguimientoPage(){
  const r=$('pg-seguimiento');r.innerHTML='';

  h+='</div></div>';c2.innerHTML=h;r.appendChild(c2);
  c2.querySelectorAll('.pat-row').forEach(row=>row.addEventListener('click',()=>{SEG_PAT=row.dataset.k;buildSeguimientoPage();}));

  if(SEG_PAT&&db[SEG_PAT]){
    const pat=db[SEG_PAT];

    TRACK.forEach(([k,lab])=>{hh+=`<span class="chip${k===SEG_VAR?' on':''}" data-v="${k}">${lab}</span>`;});
    hh+='</div><div class="chart-wrap" id="seg-chart"></div><hr class="dv"><div style="overflow-x:auto">'+snapTable(pat)+'</div></div>';
    c3.innerHTML=hh;r.appendChild(c3);
    c3.querySelectorAll('.chip').forEach(ch=>ch.addEventListener('click',()=>{SEG_VAR=ch.dataset.v;buildSeguimientoPage();}));
    const ch=$('seg-chart');if(ch)ch.innerHTML=chartSVG(pat,SEG_VAR);
  }
}
function snapTable(p){
  let h='<table class="snap"><tr><th>Parámetro</th>';p.snaps.forEach(s=>h+=`<th>${s.fecha}</th>`);h+='</tr>';
  TRACK.forEach(([k,lab])=>{h+=`<tr><td class="lab">${lab}</td>`;p.snaps.forEach(s=>{const v=s.vals[k];h+=`<td>${v==null?'·':v}</td>`;});h+='</tr>';});
  return h+'</table>';
}
function chartSVG(p,key){
  const pts=p.snaps.map((s,i)=>({i,fecha:s.fecha,v:s.vals[key]})).filter(o=>o.v!=null&&!isNaN(+o.v));
  if(!pts.length)return'<div class="empty">Sin datos registrados para este parámetro</div>';
  const W=Math.max(380,p.snaps.length*90),H=240,pad=42;
  const vals=pts.map(o=>+o.v);let mn=Math.min(...vals),mx=Math.max(...vals);if(mn===mx){mn-=1;mx+=1;}
  const X=i=>pad+(p.snaps.length<=1?(W-2*pad)/2:(i/(p.snaps.length-1))*(W-2*pad));
  const Y=v=>H-pad-((v-mn)/(mx-mn))*(H-2*pad);
  let g=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="sans-serif" style="min-width:${W}px">`;
  g+=`<line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#ccc"/><line x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}" stroke="#ccc"/>`;
  [0,0.5,1].forEach(t=>{const v=mn+t*(mx-mn),y=Y(v);g+=`<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="#eee"/><text x="4" y="${y+4}" font-size="10" fill="#999">${(+v.toFixed(1))}</text>`;});
  let d='';pts.forEach((o,j)=>{const x=X(o.i),y=Y(+o.v);d+=(j?'L':'M')+x+' '+y+' ';});
  g+=`<path d="${d}" fill="none" stroke="#7A4E9E" stroke-width="2.5" stroke-linejoin="round"/>`;
  pts.forEach(o=>{const x=X(o.i),y=Y(+o.v);g+=`<circle cx="${x}" cy="${y}" r="5" fill="#7A4E9E"/><text x="${x}" y="${y-9}" font-size="10" fill="#5d3a7c" text-anchor="middle">${o.v}</text>`;});
  p.snaps.forEach((s,i)=>{g+=`<text x="${X(i)}" y="${H-8}" font-size="9" fill="#999" text-anchor="middle">${s.fecha}</text>`;});
  return g+'</svg>';
}

function planRefs(){

  if(cl.f.some(s=>/SARC-F|marcha|prensión/i.test(s.nom)))add('ewgsop2','sarcf');
  if(rec.ejercicio)add('vivifrail');if(rec.nutricion)add('espen19','espen22','protage');
  if(rec.caidas)add('ng249','nicebmj');if(rec.demencia)add('ng97','reloj');

  return ks.map(k=>REFS[k]).filter(Boolean);
}

    if([...cl.f,...cl.x,...cl.n,...cl.c].length){

let _persisting=false,_persistAgain=false;
async function persistDB(){
  if(PLAINFALLBACK||!CRYPTO_KEY){try{localStorage.setItem(LSKEY,JSON.stringify(DBCACHE));}catch(e){alert('Error al guardar: '+e.message);}return;}
  if(_persisting){_persistAgain=true;return;}
  _persisting=true;
  try{
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const pt=new TextEncoder().encode(JSON.stringify(DBCACHE));
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},CRYPTO_KEY,pt);
    localStorage.setItem(ENCKEY,JSON.stringify({v:1,salt:b64(ENC_SALT),iv:b64(iv),ct:b64(new Uint8Array(ct))}));
  }catch(e){alert('Error al guardar cifrado: '+e.message);}
  _persisting=false;
  if(_persistAgain){_persistAgain=false;persistDB();}
}
async function setupOrUnlock(pass,confirmPass){
  if(!CRYPTO_OK){PLAINFALLBACK=true;const lg=localStorage.getItem(LSKEY);try{DBCACHE=lg?(JSON.parse(lg)||{}):{};}catch(e){DBCACHE={};}return{ok:true};}
  const raw=localStorage.getItem(ENCKEY);
  if(raw){
    let blob;try{blob=JSON.parse(raw);}catch(e){return{ok:false,msg:'El almacén cifrado está dañado.'};}
    const salt=ub64(blob.salt),iv=ub64(blob.iv),ct=ub64(blob.ct);
    const key=await deriveKey(pass,salt);
    let pt;try{pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);}catch(e){return{ok:false,msg:'Contraseña incorrecta.'};}
    try{DBCACHE=JSON.parse(new TextDecoder().decode(new Uint8Array(pt)));}catch(e){DBCACHE={};}
    CRYPTO_KEY=key;ENC_SALT=salt;return{ok:true};
  }else{
    if(pass.length<6)return{ok:false,msg:'La contraseña debe tener al menos 6 caracteres.'};
    if(pass!==confirmPass)return{ok:false,msg:'Las dos contraseñas no coinciden.'};
    const salt=crypto.getRandomValues(new Uint8Array(16));
    const key=await deriveKey(pass,salt);CRYPTO_KEY=key;ENC_SALT=salt;
    const lg=localStorage.getItem(LSKEY);try{DBCACHE=lg?(JSON.parse(lg)||{}):{};}catch(e){DBCACHE={};}
    await persistDB();
    if(lg)localStorage.removeItem(LSKEY);
    return{ok:true};
  }
}

 <h4>5. Sin garantías</h4>
 <p>La herramienta se ofrece «tal cual», sin garantía de exactitud, disponibilidad o adecuación a un fin concreto. Verifica siempre los resultados críticos.</p>
 <h4>6. Aceptación por sesión</h4>
 <p>La aceptación de estas condiciones se solicita al iniciar cada sesión.</p>`;
const MANUAL_HTML=`
 <h3>¿Qué es VGI+ y qué no es?</h3>
 <p>Es una herramienta de <span class="step">apoyo</span> para realizar y documentar la Valoración Geriátrica Integral: puntúa escalas, integra parámetros analíticos, genera un plan de recomendaciones y permite el seguimiento longitudinal. <b>No diagnostica ni sustituye tu juicio clínico.</b></p>
 <h3>Privacidad y cifrado</h3>
 <p>Todo ocurre en tu dispositivo, sin internet. Los datos de seguimiento se guardan <b>cifrados</b> (AES-256) en este navegador y solo se abren con la contraseña que creas.</p>
 <ul>
  <li><b>La contraseña no se puede recuperar.</b> Si la olvidas, no habrá forma de descifrar los datos guardados. Anótala en lugar seguro.</li>
  <li>El botón <b>Bloquear</b> (arriba a la derecha) cierra la sesión y vuelve a pedir la contraseña: útil en equipos compartidos.</li>
  <li>Trabaja preferiblemente con un <b>código de paciente</b> en lugar de nombre y apellidos.</li>
 </ul>
 <h3>Flujo de trabajo</h3>
 <ul>
  <li><span class="step">Paciente</span> — datos identificativos e historia.</li>
  <li><span class="step">Escalas</span> — cumplimenta las escalas autopuntuables.</li>
  <li><span class="step">Plan</span> — introduce los parámetros analíticos y revisa el plan generado.</li>
  <li><span class="step">Seguimiento</span> — guarda evaluaciones y observa la evolución en gráficas.</li>
  <li><span class="step">Documentos</span> — valida y descarga el informe VGI y el plan en Word.</li>
 </ul>
 <h3>Control de valores analíticos</h3>
 <p>Al introducir analíticas, la app avisa de dos formas:</p>
 <ul>
  <li><b>Amarillo</b> — valor clínicamente inusual pero posible. Solo pide una segunda mirada; no bloquea.</li>
  <li><b>Rojo</b> — valor fisiológicamente imposible (casi siempre un error de tecleo). <b>Bloquea</b> la generación de documentos hasta que corrijas la cifra o marques «Confirmo que este valor es correcto».</li>
 </ul>
 <h3>Validación de la hoja de ruta</h3>
 <p>Antes de generar el plan de recomendaciones debes marcar la casilla de <b>validación</b> en la pestaña Documentos. La app registra la <b>fecha y hora</b> de esa validación y la imprime en el documento, dejando constancia de que tú, como médico responsable, has revisado y asumido las medidas.</p>
 <h3>Copias de seguridad</h3>
 <p>Los datos viven solo en este navegador y equipo. Si cambias de dispositivo o borras los datos del navegador, se pierden. Guarda copias descargando los documentos Word de cada evaluación.</p>
 <h3>Limitaciones</h3>
 <ul>
  <li>Las recomendaciones son orientativas y requieren adaptación individual.</li>
  <li>Verifica siempre los valores y resultados críticos.</li>
  <li>Ante cualquier duda, prevalece la valoración clínica presencial.</li>
 </ul>`;
function buildManualPage(){
  const r=$('pg-manual');if(!r)return;
  const c=el('div','card');
  c.innerHTML='<div class="card-h">📖 Manual de usuario</div><div class="card-b manual">'+MANUAL_HTML+
   '<hr class="dv"><h3>Términos y condiciones</h3>'+TERMS_HTML+'</div>';
  r.innerHTML='';r.appendChild(c);
}

/* ── PANTALLA DE ACCESO (aviso legal + aceptación + contraseña) ── */
function buildGate(){
  const returning=CRYPTO_OK&&!!localStorage.getItem(ENCKEY);
  const cryptoWarn=!CRYPTO_OK?'<div class="gate-warn-nocrypto" style="display:block">⚠️ Este navegador no permite cifrado en este contexto: los datos de seguimiento se guardarán <b>sin cifrar</b> en este equipo. Para cifrarlos, abre la app en un navegador actualizado (Chrome, Edge, Safari o Firefox).</div>':'';
  let passSection='';
  if(CRYPTO_OK){
    passSection=returning
     ?'<div class="gate-sec">Desbloqueo de datos</div><div class="gate-field"><label>Contraseña</label><input type="password" id="gate-pass" autocomplete="current-password" placeholder="Tu contraseña"><div class="gate-hint">Introduce la contraseña con la que cifraste los datos en este equipo.</div></div>'
     :'<div class="gate-sec">Crear contraseña de cifrado</div><div class="gate-field"><label>Crear contraseña</label><input type="password" id="gate-pass" autocomplete="new-password" placeholder="Mínimo 6 caracteres"></div><div class="gate-field"><label>Repetir contraseña</label><input type="password" id="gate-pass2" autocomplete="new-password" placeholder="Repite la contraseña"><div class="gate-hint">⚠️ Esta contraseña cifra los datos de seguimiento en este equipo. <b>No se guarda en ningún sitio y no se puede recuperar:</b> si la olvidas, perderás el acceso a los datos ya guardados. Anótala en lugar seguro.'+(localStorage.getItem(LSKEY)?' Los datos existentes se cifrarán al entrar.':'')+'</div></div>';
  }
  const g=document.createElement('div');g.className='gate';g.id='gate';
  g.innerHTML=`<div class="gate-card">
    <div class="gate-top"><div class="glogo">${LOGO}</div><div><h2>VGI+ · Valoración Geriátrica Integral</h2><p>Herramienta de apoyo clínico · Uso local</p></div></div>
    <div class="gate-body">
      <div class="gate-disc"><b>Aviso legal</b>Herramienta de apoyo a la decisión clínica. No sustituye el juicio clínico del médico responsable, que toma y firma toda decisión asistencial.</div>
      ${cryptoWarn}
      <div class="gate-sec">Términos y condiciones · Manual</div>
      <div class="gate-tc">${TERMS_HTML}</div>
      <button class="gate-toggle" id="gate-manual-toggle">▸ Ver resumen de uso (manual)</button>
      <div class="gate-tc manual" id="gate-manual" style="display:none;margin-top:.4rem">${MANUAL_HTML}</div>
      ${passSection}
      <label class="gate-chk"><input type="checkbox" id="gate-accept"> He leído y acepto los términos y condiciones y el aviso legal.</label>
      <button class="gate-btn" id="gate-btn">Entrar${CRYPTO_OK?' y desbloquear':''}</button>
      <div class="gate-err" id="gate-err"></div>
    </div></div>`;
  document.body.appendChild(g);
  const mt=$('gate-manual-toggle'),mv=$('gate-manual');
  mt.addEventListener('click',()=>{const vis=mv.style.display!=='none';mv.style.display=vis?'none':'block';mt.textContent=(vis?'▸':'▾')+' '+(vis?'Ver':'Ocultar')+' resumen de uso (manual)';});
  const submit=()=>gateSubmit(returning);
  $('gate-btn').addEventListener('click',submit);
  ['gate-pass','gate-pass2'].forEach(id=>{const e=$(id);if(e)e.addEventListener('keydown',ev=>{if(ev.key==='Enter')submit();});});
}
function showGateErr(m){const e=$('gate-err');if(e){e.textContent=m;e.classList.add('on');}}
async function gateSubmit(){
  const e=$('gate-err');if(e)e.classList.remove('on');
  if(!$('gate-accept').checked){showGateErr('Debes leer y aceptar los términos y condiciones para continuar.');return;}
  const p1=$('gate-pass')?$('gate-pass').value:'';
  const p2=$('gate-pass2')?$('gate-pass2').value:'';
  const returning=CRYPTO_OK&&!!localStorage.getItem(ENCKEY);
  if(CRYPTO_OK&&!p1){showGateErr(returning?'Introduce tu contraseña.':'Crea una contraseña.');return;}
  const btn=$('gate-btn');btn.disabled=true;btn.textContent='Procesando…';
  const res=await setupOrUnlock(p1,p2);
  if(!res.ok){showGateErr(res.msg||'No se pudo continuar.');btn.disabled=false;btn.textContent='Entrar'+(CRYPTO_OK?' y desbloquear':'');return;}
  const gate=$('gate');if(gate)gate.remove();
  initApp();
}

/* Botón Bloquear: recarga y vuelve a la pantalla de acceso (equipos compartidos). */
{const lb=$('btn-lock');if(lb)lb.addEventListener('click',()=>location.reload());}

buildGate();
